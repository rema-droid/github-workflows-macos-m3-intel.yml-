name: Free macOS Workspace

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13 # Standard queue
    steps:
    - name: Set up Remote Desktop and VNC
      run: |
        sudo dscl . -passwd /Users/runner "Password123!"
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
          -activate -configure -access -on \
          -clientopts -setvncpasswd -vncpasswd "Password123!" \
          -privs -all -restart -agent

    - name: Install and Configure ngrok
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      run: |
        brew install ngrok
        ngrok config add-authtoken $NGROK_AUTH_TOKEN

    - name: Start Tunnel and Keep VM Alive
      run: |
        echo "Starting network tunnel..."
        ngrok tcp 5900 --log=stdout &
        sleep 5
        curl -s http://localhost:4040/api/tunnels | grep -o 'tcp://[^"]*'
        echo "VM is running. You can connect now."
        sleep 21600

